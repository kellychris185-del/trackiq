<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>TrackIQ — Greyhound Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#060608;font-family:'Barlow Condensed',sans-serif;color:#e0e0f0;min-height:100vh;}
    #app{max-width:430px;margin:0 auto;min-height:100vh;}
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-track{background:#0a0a10;}
    ::-webkit-scrollbar-thumb{background:#1c1c2e;border-radius:2px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .spin{animation:spin .8s linear infinite;}
    .pulse{animation:pulse 1.5s ease infinite;}
    .fade{animation:fadeUp .3s ease;}

    /* HEADER */
    .header{background:#0a0a12;border-bottom:1px solid #1c1c2e;position:sticky;top:0;z-index:50;padding:12px 16px 0;}
    .header-top{display:flex;justify-content:space-between;align-items:flex-start;}
    .logo{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px;color:#fff;}
    .logo span{color:#FFD200;}
    .logo-sub{color:#FFD200;font-size:9px;letter-spacing:5px;margin-bottom:3px;}
    .logo-status{display:flex;gap:8px;align-items:center;margin-top:4px;}
    .dot{width:7px;height:7px;border-radius:50%;background:#00c97d;}
    .dot.loading{background:#FFD200;animation:pulse 1s infinite;}
    .dot.error{background:#ff4d6d;}
    .status-text{color:#333355;font-size:10px;}
    .stat-pill{background:#060608;border:1px solid #1c1c2e;border-radius:10px;padding:8px 12px;text-align:right;}
    .stat-pill .label{color:#333355;font-size:8px;letter-spacing:1px;}
    .stat-pill .value{font-size:18px;font-weight:800;line-height:1;}
    .stat-pill .sub{color:#333355;font-size:8px;}
    .pills{display:flex;gap:6px;}

    /* TICKER */
    .ticker{overflow:hidden;height:22px;background:#06060c;border-top:1px solid #1c1c2e;margin-top:8px;}
    .ticker-inner{display:inline-flex;animation:ticker 30s linear infinite;white-space:nowrap;}
    .ticker-item{color:#FFD200;font-size:9px;letter-spacing:1px;margin-right:48px;padding-top:4px;display:inline-block;}

    /* TABS */
    .tabs{display:flex;padding:10px 16px 0;gap:2px;}
    .tab{flex:1;padding:7px 2px 6px;border:none;border-bottom:3px solid transparent;
      background:transparent;color:#333355;font-size:10px;font-weight:700;
      letter-spacing:.5px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;transition:all .15s;}
    .tab.active{color:#FFD200;border-bottom-color:#FFD200;}

    /* TRACK PILLS */
    .track-scroll{overflow-x:auto;padding:14px 16px 8px;white-space:nowrap;}
    .track-btn{display:inline-block;padding:5px 12px;border-radius:20px;
      border:1px solid #1c1c2e;background:transparent;color:#333355;
      font-size:10px;font-weight:600;cursor:pointer;margin-right:6px;
      font-family:'Barlow Condensed',sans-serif;transition:all .15s;}
    .track-btn.active{border-color:#FFD200;background:rgba(255,210,0,.08);color:#FFD200;}

    /* FETCH BTN */
    .fetch-btn{display:block;width:calc(100% - 32px);margin:0 16px 14px;
      background:rgba(0,201,125,.06);border:1px solid rgba(0,201,125,.2);
      color:#00c97d;border-radius:10px;padding:10px;font-size:12px;font-weight:700;
      cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
    .fetch-btn:disabled{color:#FFD200;animation:pulse 1s infinite;}

    /* RACE CARD */
    .race-card{background:#0a0a14;border:1px solid #1c1c2e;border-radius:14px;
      margin:0 16px 10px;overflow:hidden;transition:border-color .2s;}
    .race-card.expanded{border-color:#FFD200;}
    .race-header{padding:12px 14px;display:flex;justify-content:space-between;
      align-items:center;cursor:pointer;}
    .race-meta{color:#FFD200;font-size:10px;letter-spacing:.5px;margin-bottom:3px;}
    .race-title{font-size:22px;font-weight:900;color:#e0e0f0;letter-spacing:-.5px;}
    .race-pick{color:#444466;font-size:10px;margin-top:2px;}
    .race-result-badge{display:inline-block;background:rgba(0,201,125,.1);color:#00c97d;
      font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid rgba(0,201,125,.2);margin-right:8px;}
    .ai-btn{background:rgba(255,210,0,.08);border:1px solid rgba(255,210,0,.25);
      color:#FFD200;border-radius:8px;padding:6px 10px;font-size:10px;font-weight:700;
      cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
    .chevron{color:#1c1c2e;font-size:14px;margin-left:6px;}

    /* DOG TABLE */
    .dog-headers{display:grid;grid-template-columns:26px 1fr 50px 42px 50px 44px;gap:4px;
      padding:6px 14px;background:#060608;color:#1c1c2e;font-size:9px;letter-spacing:1px;
      border-top:1px solid #1c1c2e;}
    .dog-row{display:grid;grid-template-columns:26px 1fr 50px 42px 50px 44px;gap:4px;
      padding:9px 14px;border-top:1px solid #0d0d18;align-items:center;transition:background .1s;}
    .dog-row.top-pick{background:rgba(255,210,0,.025);}
    .box-num{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;
      justify-content:center;font-size:11px;font-weight:800;color:#fff;}
    .dog-name{font-size:13px;font-weight:700;}
    .dog-name.top{color:#FFD200;}
    .dog-trainer{color:#333355;font-size:9px;}
    .dog-form{text-align:center;color:#444466;font-size:10px;}
    .score-badge{padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700;}
    .score-hi{background:rgba(0,201,125,.12);color:#00c97d;}
    .score-mid{background:rgba(255,210,0,.12);color:#FFD200;}
    .score-lo{background:rgba(255,77,109,.1);color:#ff4d6d;}
    .odds{text-align:right;font-size:16px;font-weight:900;}
    .odds-lo{color:#00c97d;}
    .odds-mid{color:#FFD200;}
    .odds-hi{color:#ff8c42;}
    .sig{padding:2px 5px;border-radius:4px;font-size:8px;font-weight:700;letter-spacing:.5px;}
    .sig-value{background:rgba(0,201,125,.12);color:#00c97d;}
    .sig-avoid{background:rgba(255,77,109,.1);color:#ff4d6d;}
    .sig-fair{background:rgba(255,255,255,.04);color:#444;}
    .dog-actions{padding:10px 14px;border-top:1px solid #1c1c2e;}
    .add-bet-btn{width:100%;background:rgba(255,210,0,.08);border:1px solid rgba(255,210,0,.3);
      color:#FFD200;border-radius:10px;padding:10px;font-size:13px;font-weight:700;
      cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

    /* LOADING CARDS */
    .loading-card{background:#0a0a14;border:1px solid #1c1c2e;border-radius:14px;
      height:80px;margin:0 16px 10px;display:flex;align-items:center;justify-content:center;
      color:#FFD200;font-size:10px;letter-spacing:3px;}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;
      display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:#0a0a14;border:1px solid rgba(255,210,0,.3);border-radius:16px;
      width:100%;max-width:430px;padding:22px;max-height:80vh;overflow-y:auto;animation:fadeUp .25s ease;}
    .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
    .modal-label{color:#FFD200;font-size:9px;letter-spacing:4px;margin-bottom:4px;}
    .modal-title{font-size:22px;font-weight:900;}
    .modal-close{background:transparent;border:1px solid #1c1c2e;color:#555;
      border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;}
    .modal-loading{text-align:center;padding:40px 0;}
    .modal-dots{display:flex;gap:8px;justify-content:center;margin-top:16px;}
    .modal-dot{width:10px;height:10px;border-radius:50%;background:#FFD200;}
    .modal-text{color:#a0a0c0;font-family:'JetBrains Mono',monospace;font-size:12px;
      line-height:1.85;white-space:pre-wrap;background:#060608;border-radius:10px;
      padding:16px;border:1px solid #1c1c2e;}

    /* BET MODAL */
    .bet-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;
      display:flex;align-items:flex-end;justify-content:center;}
    .bet-modal{background:#0a0a14;border:1px solid #1c1c2e;border-radius:16px 16px 0 0;
      width:100%;max-width:430px;padding:20px;animation:fadeUp .2s ease;}
    .bet-section-label{color:#444466;font-size:10px;letter-spacing:1px;margin-bottom:8px;}
    .dog-scroll{overflow-x:auto;margin-bottom:14px;}
    .dog-chips{display:flex;gap:6px;width:max-content;padding-bottom:4px;}
    .dog-chip{padding:6px 10px;border-radius:9px;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;text-align:center;border:1px solid #1c1c2e;
      background:transparent;transition:all .15s;}
    .dog-chip.selected{border-color:#FFD200;background:rgba(255,210,0,.08);}
    .chip-box{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;
      justify-content:center;font-size:11px;font-weight:800;color:#fff;margin:0 auto 3px;}
    .chip-name{font-size:9px;color:#888;white-space:nowrap;}
    .chip-odds{font-size:13px;font-weight:900;color:#FFD200;}
    .chip-val{font-size:9px;}
    .type-row{display:flex;gap:6px;margin-bottom:14px;}
    .type-btn{flex:1;padding:8px;border-radius:9px;border:1px solid #1c1c2e;
      background:transparent;color:#555;font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;transition:all .15s;}
    .type-btn.selected{border-color:#FFD200;background:rgba(255,210,0,.08);color:#FFD200;}
    .stake-row{display:flex;gap:6px;margin-bottom:14px;}
    .stake-btn{flex:1;padding:8px;border-radius:9px;border:1px solid #1c1c2e;
      background:transparent;color:#555;font-size:14px;font-weight:700;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;transition:all .15s;}
    .stake-btn.selected{border-color:#FFD200;background:rgba(255,210,0,.08);color:#FFD200;}
    .bet-summary{background:rgba(255,210,0,.04);border:1px solid rgba(255,210,0,.1);
      border-radius:10px;padding:10px 14px;margin-bottom:14px;}
    .bet-summary-row{display:flex;justify-content:space-between;margin-bottom:4px;}
    .confirm-btn{width:100%;background:#FFD200;border:none;border-radius:11px;padding:14px;
      color:#060608;font-size:16px;font-weight:900;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

    /* BETS LIST */
    .bet-item{background:#0a0a14;border-radius:12px;padding:12px 14px;margin:0 16px 10px;
      display:flex;justify-content:space-between;align-items:center;}
    .bet-item.won{border:1px solid rgba(0,201,125,.3);}
    .bet-item.lost{border:1px solid rgba(255,77,109,.2);}
    .bet-item.pending{border:1px solid #1c1c2e;}
    .bet-dog-row{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
    .bet-name{color:#e0e0f0;font-size:14px;font-weight:700;}
    .bet-meta{color:#333355;font-size:10px;}
    .bet-stake{color:#444466;font-size:11px;margin-top:2px;}
    .bet-status{font-size:12px;font-weight:800;margin-bottom:4px;}
    .bet-status.won{color:#00c97d;}
    .bet-status.lost{color:#ff4d6d;}
    .bet-status.pending{color:#FFD200;}
    .bet-pl{font-size:20px;font-weight:900;}
    .bet-pl.won{color:#00c97d;}
    .bet-pl.lost{color:#ff4d6d;}
    .bet-pl.pending{color:#555;}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px;}
    .stat-card{background:#0a0a14;border:1px solid #1c1c2e;border-radius:12px;padding:14px;}
    .stat-card .label{color:#333355;font-size:9px;letter-spacing:2px;margin-bottom:6px;}
    .stat-card .value{font-size:26px;font-weight:900;line-height:1;}

    /* MODEL TAB */
    .model-section{padding:0 16px 14px;}
    .model-card{background:#0a0a14;border:1px solid #1c1c2e;border-radius:14px;padding:18px;margin-bottom:14px;}
    .model-desc{color:#444466;font-size:11px;line-height:1.6;margin-bottom:14px;}
    .slider-row{margin-bottom:14px;}
    .slider-label{display:flex;justify-content:space-between;margin-bottom:6px;}
    .slider-name{color:#666688;font-size:11px;}
    .slider-val{color:#FFD200;font-size:12px;font-weight:700;}
    input[type=range]{width:100%;-webkit-appearance:none;height:3px;border-radius:2px;
      background:#1c1c2e;outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
      border-radius:50%;background:#FFD200;cursor:pointer;}
    .reset-btn{background:transparent;border:1px solid #1c1c2e;color:#444;
      border-radius:8px;padding:7px 14px;font-size:10px;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
    .how-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
    .how-icon{font-size:14px;}
    .how-text{color:#666688;font-size:12px;line-height:1.5;}
    .section-label{color:#FFD200;font-size:10px;letter-spacing:3px;margin-bottom:12px;}

    /* NOTIFICATION */
    .notif{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;
      background:#0a1f14;border:1px solid #00c97d;border-radius:10px;
      padding:9px 18px;color:#fff;font-size:12px;letter-spacing:.5px;
      white-space:nowrap;animation:fadeUp .2s ease;max-width:88vw;text-align:center;}
    .notif.err{background:#1f0a0a;border-color:#ff4d6d;}

    /* EMPTY */
    .empty{text-align:center;padding:60px 20px;color:#1c1c2e;}
    .empty-icon{font-size:40px;margin-bottom:12px;}
    .empty-title{font-size:18px;font-weight:700;color:#1c1c2e;}
    .empty-sub{font-size:12px;margin-top:8px;}

    .results-item{background:#0a0a14;border:1px solid #1c1c2e;border-radius:10px;
      padding:10px 14px;margin:0 16px 8px;display:flex;justify-content:space-between;align-items:center;}
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ── Storage ──
const store = {
  get(k) { try { const v=localStorage.getItem('tiq_'+k); if(v===null) throw 0; return JSON.parse(v); } catch{ return null; } },
  set(k,v) { try{ localStorage.setItem('tiq_'+k, JSON.stringify(v)); }catch{} }
};

// ── Box colours ──
const BOX_COLORS = ['#e74c3c','#3498db','#f1c40f','#27ae60','#e67e22','#8e44ad','#ec407a','#00bcd4'];
const AU_TRACKS = ['Wentworth Park','The Meadows','Sandown Park','Albion Park','Angle Park','Cannington','Dapto','Richmond'];

// ── State ──
let state = {
  tab: 'races',
  trackIdx: 0,
  raceData: null,
  results: store.get('results') || [],
  bets: store.get('bets') || [],
  weights: store.get('weights') || {form:40,winRate:25,boxDraw:15,speed:20},
  modelStats: store.get('modelStats') || {correct:0,total:0,accuracy:0,roi:0},
  expandedRace: 0,
  aiModal: null,
  betModal: null,
  notification: null,
  loading: true,
  refreshing: false,
  fetchingResults: false,
  status: 'Initialising...',
  ticker: [],
  selDog: null,
  selType: 'WIN',
  selStake: '10',
};

// ── API call via server proxy ──
async function callClaude(system, user, useSearch=false) {
  const body = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    system,
    messages: [{role:'user',content:user}],
  };
  if(useSearch) body.tools = [{type:'web_search_20250305',name:'web_search'}];
  const r = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  const d = await r.json();
  return d.content?.filter(b=>b.type==='text').map(b=>b.text).join('\n') || '';
}

// ── Scoring ──
function scoreDog(dog, w) {
  const parts = (dog.form||'3-3-3-3-3').split('-').slice(0,5);
  const formScore = parts.reduce((a,r,i)=>a+Math.max(0,(6-parseInt(r||4))*20)*Math.pow(0.85,i),0)/5;
  const wins = parts.filter(r=>r==='1').length;
  const winRate = wins/parts.length*100;
  const boxAdv = [14,13,12,11,11,12,10,9][Math.min((dog.box||1)-1,7)];
  const speedScore = Math.max(0,100-((dog.bestTime||30.5)-29.3)*18);
  const raw = formScore*(w.form/100)+winRate*(w.winRate/100)+boxAdv*(w.boxDraw/100)+speedScore*(w.speed/100);
  return Math.min(99,Math.max(1,Math.round(raw*1.4)));
}

function calcProbs(dogs, w) {
  const scores = dogs.map(d=>scoreDog(d,w));
  const total = scores.reduce((a,b)=>a+b,0);
  return dogs.map((d,i)=>({
    ...d,
    aiScore: scores[i],
    winProb: +((scores[i]/total)*100).toFixed(1),
    fairOdds: +(total/scores[i]).toFixed(2),
    value: (total/scores[i])<(d.odds*0.88)?'VALUE':(total/scores[i])>(d.odds*1.25)?'AVOID':'FAIR',
  }));
}

// ── Fetch race data ──
async function fetchRaces(track) {
  state.refreshing = true;
  state.status = `Searching live data for ${track}...`;
  render();
  const today = new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const sys = `You are a greyhound racing data extraction engine. Respond ONLY with valid JSON. Today is ${today} Australia.`;
  const prompt = `Search for today's greyhound racing at ${track} in Australia for ${today}.
Find race card with: race times, distances, grades, and for each dog: box, name, trainer, form (last 5 as "1-2-3-1-4"), bestTime in seconds, TAB odds.
Return ONLY this JSON:
{"track":"${track}","date":"${today}","races":[{"raceNum":1,"time":"7:03 PM","dist":520,"grade":"Grade 5","dogs":[{"box":1,"name":"Dog Name","trainer":"Trainer Name","form":"1-2-3-1-4","bestTime":29.84,"odds":3.50}]}]}
If no real data found, use realistic Australian greyhound data with real trainer names (Jason Thompson, Robert Britton, Paul Abela, Andrea Dailly). Return ONLY JSON.`;
  try {
    const raw = await callClaude(sys, prompt, true);
    const clean = raw.replace(/```json|```/g,'').trim();
    const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
    const data = JSON.parse(clean.slice(s,e+1));
    if(data && data.races?.length>0) {
      data.races = data.races.map(race=>{
        const scored = calcProbs(race.dogs||[], state.weights);
        const top = [...scored].sort((a,b)=>b.aiScore-a.aiScore)[0];
        return {...race, dogs:scored, topPick:top};
      });
      state.raceData = data;
      state.status = `Live — ${data.races.length} races loaded`;
      notify(`✓ ${data.races.length} races loaded for ${track}`);
    } else { state.status = 'No data — retrying soon'; }
  } catch(e) { state.status = 'Fetch error — will retry'; }
  state.refreshing = false;
  render();
}

// ── Fetch results ──
async function fetchResults(track) {
  state.fetchingResults = true;
  state.status = `Fetching results for ${track}...`;
  render();
  const today = new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const sys = `You are a greyhound racing results engine. Respond ONLY with valid JSON. Today is ${today} Australia.`;
  const prompt = `Search for most recent greyhound race results from ${track} in Australia.
Return ONLY:
{"results":[{"raceNum":1,"time":"7:03 PM","dist":520,"winner":{"box":6,"name":"Dog Name","trainer":"Trainer","winTime":29.77,"margin":0.8},"second":{"box":2,"name":"Dog Name"},"third":{"box":4,"name":"Dog Name"},"dividends":{"win":3.20,"place":1.60}}]}
Return ONLY JSON.`;
  try {
    const raw = await callClaude(sys, prompt, true);
    const clean = raw.replace(/```json|```/g,'').trim();
    const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
    const data = JSON.parse(clean.slice(s,e+1));
    if(data?.results?.length>0) {
      const newResults = data.results.map(r=>({...r, track, id:`${track}-R${r.raceNum}`, fetchedAt:new Date().toISOString()}));
      state.results = [...newResults, ...state.results.filter(r=>r.track!==track)];
      store.set('results', state.results);
      state.ticker = newResults.map(r=>`${track} R${r.raceNum} → 🥇 Box ${r.winner?.box} ${r.winner?.name} @ $${r.dividends?.win||'—'}`);

      // AI learning
      if(state.raceData?.track===track) {
        let w = {...state.weights};
        let correct = 0;
        newResults.forEach(result=>{
          const race = state.raceData.races.find(r=>r.raceNum===result.raceNum);
          if(!race||!race.topPick) return;
          if(race.topPick.box===result.winner?.box) correct++;
          else {
            const winner = race.dogs.find(d=>d.box===result.winner?.box);
            if(winner) {
              if(winner.form?.split('-')[0]==='1') w.form=Math.min(65,w.form+1.5);
              if(result.winner?.box<=2) w.boxDraw=Math.min(30,w.boxDraw+1);
            }
          }
        });
        // Normalise
        const tot = Object.values(w).reduce((a,b)=>a+b,0);
        if(tot>110) { const r=100/tot; Object.keys(w).forEach(k=>w[k]=Math.round(w[k]*r)); }
        state.weights = w;
        store.set('weights', w);

        // Rescore
        if(state.raceData) {
          state.raceData.races = state.raceData.races.map(race=>{
            const scored = calcProbs(race.dogs, state.weights);
            return {...race, dogs:scored, topPick:[...scored].sort((a,b)=>b.aiScore-a.aiScore)[0]};
          });
        }

        // Update model stats
        const total = state.modelStats.total + newResults.length;
        const totalCorrect = state.modelStats.correct + correct;
        const accuracy = total>0?+((totalCorrect/total)*100).toFixed(1):0;
        state.modelStats = {correct:totalCorrect,total,accuracy,roi:+((accuracy/100*2.9-1)*100).toFixed(1)};
        store.set('modelStats', state.modelStats);

        // Settle bets
        state.bets = state.bets.map(bet=>{
          if(bet.status!=='PENDING') return bet;
          const res = newResults.find(r=>r.track===track&&r.raceNum===bet.raceNum);
          if(!res) return bet;
          const won = res.winner?.box===bet.box;
          return {...bet,status:won?'WON':'LOST',returns:won?+(bet.stake*bet.odds).toFixed(2):0};
        });
        store.set('bets', state.bets);
      }

      state.status = 'Results in — model updated';
      notify('✓ Results fetched & model updated');
    }
  } catch(e) { state.status = 'Result fetch failed'; }
  state.fetchingResults = false;
  render();
}

// ── AI tip ──
async function getAITip(race) {
  state.aiModal = {race, text:'', loading:true};
  render();
  const track = state.raceData?.track || AU_TRACKS[state.trackIdx];
  const resultForRace = state.results.find(r=>r.track===track&&r.raceNum===race.raceNum);
  const pastCtx = resultForRace
    ? `THIS RACE HAS BEEN RUN: Winner Box ${resultForRace.winner?.box} ${resultForRace.winner?.name} in ${resultForRace.winner?.winTime}s. Win div: $${resultForRace.dividends?.win}.`
    : `Model accuracy: ${state.modelStats.accuracy}% from ${state.modelStats.total} races.`;
  const dogLines = race.dogs.map(d=>`Box ${d.box}: ${d.name} | ${d.trainer} | Form: ${d.form} | Best: ${d.bestTime}s | Score: ${d.aiScore}/99 | Win%: ${d.winProb}% | TAB: $${d.odds} | Fair: $${d.fairOdds} | ${d.value}`).join('\n');
  const sys = `You are TrackIQ, Australia's sharpest greyhound tipster. Be direct, punchy, Aussie.`;
  const prompt = `Race ${race.raceNum} at ${track} — ${race.dist}m ${race.grade}\n${pastCtx}\nWeights: Form ${state.weights.form}% | WinRate ${state.weights.winRate}% | BoxDraw ${state.weights.boxDraw}% | Speed ${state.weights.speed}%\n\nDogs:\n${dogLines}\n\nGive:\n1. TOP SELECTION — box, name, 2-line reason\n2. VALUE BET — best overlay\n3. SUGGESTED BET — type + stake units\n4. AVOID — one dog, one reason\n\nMax 180 words.`;
  try {
    const text = await callClaude(sys, prompt, false);
    state.aiModal = {race, text, loading:false};
  } catch {
    state.aiModal = {race, text:'Analysis unavailable.', loading:false};
  }
  render();
}

// ── Add bet ──
function addBet() {
  if(!state.selDog||!state.betModal) return;
  const bet = {
    id:Date.now(), date:new Date().toLocaleDateString('en-AU'),
    track:state.raceData?.track, raceNum:state.betModal.raceNum,
    race:`R${state.betModal.raceNum}`, dog:state.selDog.name, box:state.selDog.box,
    betType:state.selType, stake:+state.selStake, odds:state.selDog.odds,
    aiScore:state.selDog.aiScore, winProb:state.selDog.winProb, status:'PENDING', returns:0,
  };
  state.bets = [bet,...state.bets];
  store.set('bets', state.bets);
  state.betModal = null;
  notify(`Bet added: $${state.selStake} on Box ${bet.box} ${bet.dog} @ $${bet.odds}`);
  render();
}

// ── Notify ──
function notify(msg, type='ok') {
  state.notification = {msg,type};
  render();
  setTimeout(()=>{ state.notification=null; render(); }, 3000);
}

// ── Auto refresh ──
let refreshTimer;
function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(()=>{
    const track = AU_TRACKS[state.trackIdx];
    fetchRaces(track);
    fetchResults(track);
  }, 4*60*1000);
}

// ── RENDER ──
function render() {
  const app = document.getElementById('app');
  const track = AU_TRACKS[state.trackIdx];
  const profit = state.bets.filter(b=>b.status!=='PENDING').reduce((s,b)=>s+b.returns-b.stake,0);
  const pending = state.bets.filter(b=>b.status==='PENDING').length;

  app.innerHTML = `
    ${state.notification ? `<div class="notif${state.notification.type==='err'?' err':''}">${state.notification.msg}</div>` : ''}

    <div class="header">
      <div class="header-top">
        <div>
          <div class="logo-sub">AUSTRALIAN GREYHOUNDS · LIVE</div>
          <div class="logo">TRACK<span>IQ</span></div>
          <div class="logo-status">
            <div class="dot${state.refreshing||state.fetchingResults?' loading':''}"></div>
            <div class="status-text">${state.status}</div>
          </div>
        </div>
        <div class="pills">
          <div class="stat-pill">
            <div class="label">MODEL</div>
            <div class="value" style="color:#FFD200">${state.modelStats.total>0?state.modelStats.accuracy+'%':'—'}</div>
            <div class="sub">${state.modelStats.total} races</div>
          </div>
          <div class="stat-pill">
            <div class="label">P&L</div>
            <div class="value" style="color:${profit>=0?'#00c97d':'#ff4d6d'}">${profit>=0?'+':''}$${profit.toFixed(0)}</div>
            <div class="sub">units</div>
          </div>
        </div>
      </div>

      ${state.ticker.length>0?`
      <div class="ticker">
        <div class="ticker-inner">
          ${[...state.ticker,...state.ticker].map(t=>`<span class="ticker-item">◆ ${t}</span>`).join('')}
        </div>
      </div>`:''}

      <div class="tabs">
        <button class="tab${state.tab==='races'?' active':''}" onclick="setTab('races')">🐕 RACES</button>
        <button class="tab${state.tab==='model'?' active':''}" onclick="setTab('model')">🤖 MODEL</button>
        <button class="tab${state.tab==='bets'?' active':''}" onclick="setTab('bets')">📋 BETS${pending>0?' ('+pending+')':''}</button>
        <button class="tab${state.tab==='stats'?' active':''}" onclick="setTab('stats')">📊 STATS</button>
      </div>
    </div>

    ${state.tab==='races'?renderRaces(track):''}
    ${state.tab==='model'?renderModel():''}
    ${state.tab==='bets'?renderBets():''}
    ${state.tab==='stats'?renderStats():''}

    ${state.aiModal?renderAIModal():''}
    ${state.betModal?renderBetModal():''}
    <div style="height:50px"></div>
  `;
}

function renderRaces(track) {
  return `
    <div class="track-scroll">
      ${AU_TRACKS.map((t,i)=>`<button class="track-btn${state.trackIdx===i?' active':''}" onclick="setTrack(${i})">${t}</button>`).join('')}
    </div>
    <button class="fetch-btn" ${state.fetchingResults?'disabled':''} onclick="fetchResults('${track}')">
      ${state.fetchingResults?'🔄 AI FETCHING RESULTS & UPDATING MODEL...':'⚡ FETCH LATEST RESULTS + UPDATE AI MODEL'}
    </button>
    ${!state.raceData||state.refreshing
      ? `<div class="loading-card pulse">AI FETCHING LIVE DATA...</div><div class="loading-card pulse" style="animation-delay:.2s">AI FETCHING LIVE DATA...</div><div class="loading-card pulse" style="animation-delay:.4s">AI FETCHING LIVE DATA...</div>`
      : state.raceData.races.map((race,idx)=>renderRaceCard(race,idx,track)).join('')
    }
  `;
}

function renderRaceCard(race, idx, track) {
  const expanded = state.expandedRace===idx;
  const result = state.results.find(r=>r.track===track&&r.raceNum===race.raceNum);
  return `
    <div class="race-card${expanded?' expanded':''}">
      <div class="race-header" onclick="toggleRace(${idx})">
        <div>
          <div class="race-meta">
            ${result?`<span class="race-result-badge">RESULT IN</span>`:''}
            ${race.time} · ${race.dist}m · ${race.grade}
          </div>
          <div class="race-title">Race ${race.raceNum}</div>
          ${race.topPick&&!result?`<div class="race-pick">★ Top pick: Box ${race.topPick.box} ${race.topPick.name} (${race.topPick.winProb}%)</div>`:''}
          ${result?`<div class="race-pick" style="color:#00c97d">🥇 Box ${result.winner?.box} ${result.winner?.name} · $${result.dividends?.win}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="ai-btn" onclick="event.stopPropagation();openAI(${idx})">AI TIPS</button>
          <span class="chevron">${expanded?'▲':'▼'}</span>
        </div>
      </div>
      ${expanded?`
        <div class="dog-headers">
          <div></div><div>DOG / TRAINER</div><div style="text-align:center">FORM</div>
          <div style="text-align:center">AI</div><div style="text-align:right">ODDS</div><div style="text-align:center">SIG</div>
        </div>
        ${race.dogs.map(dog=>`
          <div class="dog-row${dog.box===race.topPick?.box?' top-pick':''}">
            <div class="box-num" style="background:${BOX_COLORS[dog.box-1]||'#555'}">${dog.box}</div>
            <div>
              <div class="dog-name${dog.box===race.topPick?.box?' top':''}">${dog.name}${dog.box===race.topPick?.box?' ★':''}${result?.winner?.box===dog.box?' 🥇':''}</div>
              <div class="dog-trainer">${dog.trainer}</div>
            </div>
            <div class="dog-form">${dog.form}</div>
            <div style="text-align:center"><span class="score-badge ${dog.aiScore>=75?'score-hi':dog.aiScore>=55?'score-mid':'score-lo'}">${dog.aiScore}</span></div>
            <div class="odds ${dog.odds<=3?'odds-lo':dog.odds<=7?'odds-mid':'odds-hi'}">${dog.odds}</div>
            <div style="text-align:center"><span class="sig ${dog.value==='VALUE'?'sig-value':dog.value==='AVOID'?'sig-avoid':'sig-fair'}">${dog.value}</span></div>
          </div>
        `).join('')}
        <div class="dog-actions">
          <button class="add-bet-btn" onclick="openBet(${idx})">+ ADD BET</button>
        </div>
      `:''}
    </div>
  `;
}

function renderAIModal() {
  const {race, text, loading} = state.aiModal;
  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeAI()">
      <div class="modal">
        <div class="modal-header">
          <div>
            <div class="modal-label">TRACKIQ · LIVE ANALYSIS</div>
            <div class="modal-title">R${race.raceNum} Analysis</div>
          </div>
          <button class="modal-close" onclick="closeAI()">✕</button>
        </div>
        ${loading?`
          <div class="modal-loading">
            <div style="color:#FFD200;font-size:10px;letter-spacing:4px">ANALYSING...</div>
            <div class="modal-dots">
              ${[0,1,2].map(i=>`<div class="modal-dot pulse" style="animation-delay:${i*.2}s"></div>`).join('')}
            </div>
          </div>
        `:`<div class="modal-text">${text}</div>`}
      </div>
    </div>
  `;
}

function renderBetModal() {
  const race = state.betModal;
  const dogs = race.dogs?.filter(d=>!d.scratched)||[];
  return `
    <div class="bet-modal-overlay" onclick="if(event.target===this)closeBet()">
      <div class="bet-modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="font-size:20px;font-weight:800;color:#e0e0f0">Add Bet — R${race.raceNum}</div>
          <button class="modal-close" onclick="closeBet()">✕</button>
        </div>
        <div class="bet-section-label">SELECT DOG</div>
        <div class="dog-scroll">
          <div class="dog-chips">
            ${dogs.map(d=>`
              <div class="dog-chip${state.selDog?.box===d.box?' selected':''}" onclick="selDog(${d.box})">
                <div class="chip-box" style="background:${BOX_COLORS[d.box-1]||'#555'}">${d.box}</div>
                <div class="chip-name">${d.name.split(' ')[0]}</div>
                <div class="chip-odds">$${d.odds}</div>
                <div class="chip-val" style="color:${d.value==='VALUE'?'#00c97d':'#444'}">${d.value}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="bet-section-label">BET TYPE</div>
        <div class="type-row">
          ${['WIN','EACH WAY','PLACE'].map(t=>`<button class="type-btn${state.selType===t?' selected':''}" onclick="selType('${t}')">${t}</button>`).join('')}
        </div>
        <div class="bet-section-label">STAKE</div>
        <div class="stake-row">
          ${['5','10','20','50'].map(s=>`<button class="stake-btn${state.selStake===s?' selected':''}" onclick="selStake('${s}')">$${s}</button>`).join('')}
        </div>
        ${state.selDog?`
          <div class="bet-summary">
            <div class="bet-summary-row">
              <span style="color:#888;font-size:12px">Potential return</span>
              <span style="color:#FFD200;font-size:16px;font-weight:800">$${(+state.selStake*state.selDog.odds).toFixed(2)}</span>
            </div>
            <div class="bet-summary-row">
              <span style="color:#888;font-size:12px">AI win probability</span>
              <span style="color:#00c97d;font-size:12px;font-weight:700">${state.selDog.winProb}%</span>
            </div>
          </div>
        `:''}
        <button class="confirm-btn" onclick="addBet()">CONFIRM BET</button>
      </div>
    </div>
  `;
}

function renderBets() {
  if(state.bets.length===0) return `<div class="empty"><div class="empty-icon">🐕</div><div class="empty-title">No bets yet</div><div class="empty-sub">Open a race and tap ADD BET</div></div>`;
  return state.bets.map(bet=>`
    <div class="bet-item ${bet.status.toLowerCase()}">
      <div>
        <div class="bet-dog-row">
          <div class="box-num" style="background:${BOX_COLORS[bet.box-1]||'#555'};width:22px;height:22px;border-radius:5px;font-size:11px">${bet.box}</div>
          <div class="bet-name">${bet.dog}</div>
        </div>
        <div class="bet-meta">${bet.date} · ${bet.track} ${bet.race} · ${bet.betType}</div>
        <div class="bet-stake">$${bet.stake} @ $${bet.odds} · AI ${bet.aiScore}/99</div>
      </div>
      <div style="text-align:right">
        <div class="bet-status ${bet.status.toLowerCase()}">${bet.status}</div>
        <div class="bet-pl ${bet.status.toLowerCase()}">
          ${bet.status==='WON'?'+$'+(bet.returns-bet.stake).toFixed(2):bet.status==='LOST'?'-$'+bet.stake:'—'}
        </div>
      </div>
    </div>
  `).join('');
}

function renderStats() {
  const settled = state.bets.filter(b=>b.status!=='PENDING');
  const won = settled.filter(b=>b.status==='WON');
  const staked = settled.reduce((s,b)=>s+b.stake,0);
  const returns = settled.reduce((s,b)=>s+b.returns,0);
  const profit = returns-staked;
  return `
    <div style="padding:0 16px;margin-bottom:16px"><div class="section-label">PERFORMANCE</div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">BETS PLACED</div><div class="value">${settled.length}</div></div>
      <div class="stat-card"><div class="label">WINNERS</div><div class="value" style="color:#00c97d">${won.length}</div></div>
      <div class="stat-card"><div class="label">STRIKE RATE</div><div class="value" style="color:#FFD200">${settled.length>0?((won.length/settled.length)*100).toFixed(0)+'%':'—'}</div></div>
      <div class="stat-card"><div class="label">NET P&L</div><div class="value" style="color:${profit>=0?'#00c97d':'#ff4d6d'}">${profit>=0?'+':''}$${profit.toFixed(2)}</div></div>
    </div>
    <div style="padding:0 16px;margin-bottom:12px"><div class="section-label">RECENT RESULTS</div></div>
    ${state.results.length===0
      ? `<div style="color:#333355;font-size:12px;text-align:center;padding:30px 0">Tap "Fetch Latest Results" on the Races tab</div>`
      : state.results.slice(0,15).map(r=>`
        <div class="results-item">
          <div>
            <div style="color:#e0e0f0;font-size:13px;font-weight:700">${r.track} R${r.raceNum}</div>
            <div style="color:#333355;font-size:10px;margin-top:2px">🥇 Box ${r.winner?.box} ${r.winner?.name} · ${r.winner?.winTime}s</div>
          </div>
          <div style="text-align:right">
            <div style="color:#FFD200;font-size:16px;font-weight:900">$${r.dividends?.win||'—'}</div>
            <div style="color:#333355;font-size:9px">win div</div>
          </div>
        </div>
      `).join('')
    }
  `;
}

function renderModel() {
  const wLabels = {form:'Recent Form',winRate:'Win Rate',boxDraw:'Box Draw',speed:'Speed Rating'};
  return `
    <div class="model-section">
      <div class="section-label">AI WEIGHT CALIBRATION</div>
      <div class="model-card">
        <div class="model-desc">These weights auto-adjust after every result fetch. The model learns what actually predicts winners at each track.</div>
        ${Object.entries(state.weights).map(([k,v])=>`
          <div class="slider-row">
            <div class="slider-label">
              <span class="slider-name">${wLabels[k]||k}</span>
              <span class="slider-val">${v}%</span>
            </div>
            <input type="range" min="5" max="65" value="${v}" oninput="updateWeight('${k}',this.value)">
          </div>
        `).join('')}
        <button class="reset-btn" onclick="resetWeights()">RESET TO DEFAULT</button>
      </div>
      <div class="section-label">MODEL PERFORMANCE</div>
      <div class="stats-grid" style="padding:0 0 14px">
        <div class="stat-card"><div class="label">ACCURACY</div><div class="value" style="color:#FFD200">${state.modelStats.total>0?state.modelStats.accuracy+'%':'—'}</div></div>
        <div class="stat-card"><div class="label">RACES TRACKED</div><div class="value">${state.modelStats.total}</div></div>
        <div class="stat-card"><div class="label">CORRECT TIPS</div><div class="value" style="color:#00c97d">${state.modelStats.correct}</div></div>
        <div class="stat-card"><div class="label">MODEL ROI</div><div class="value" style="color:${state.modelStats.roi>=0?'#00c97d':'#ff4d6d'}">${state.modelStats.total>0?state.modelStats.roi+'%':'—'}</div></div>
      </div>
      <div class="section-label">HOW THE MODEL LEARNS</div>
      <div class="model-card">
        ${[
          ['🔍','Every 4 minutes, searches live Australian greyhound data'],
          ['📊','Each dog scored on Form, Win Rate, Box Draw & Speed'],
          ['⚡','When results come in, compares tips to reality'],
          ['🧠','Weights shift toward whatever factor predicted the winner'],
          ['📈','Accuracy improves as more races are tracked'],
          ['💰','VALUE flag = probability higher than market implies'],
        ].map(([icon,text])=>`<div class="how-row"><span class="how-icon">${icon}</span><span class="how-text">${text}</span></div>`).join('')}
      </div>
    </div>
  `;
}

// ── Event handlers (global) ──
window.setTab = t => { state.tab=t; render(); };
window.setTrack = i => {
  state.trackIdx=i; state.raceData=null; state.expandedRace=0;
  render();
  fetchRaces(AU_TRACKS[i]);
};
window.toggleRace = i => { state.expandedRace=state.expandedRace===i?-1:i; render(); };
window.openAI = i => { if(state.raceData) getAITip(state.raceData.races[i]); };
window.closeAI = () => { state.aiModal=null; render(); };
window.openBet = i => {
  if(!state.raceData) return;
  const race = state.raceData.races[i];
  state.betModal = race;
  state.selDog = race.topPick||race.dogs?.[0];
  state.selType = 'WIN';
  state.selStake = '10';
  render();
};
window.closeBet = () => { state.betModal=null; render(); };
window.selDog = box => {
  if(!state.betModal) return;
  state.selDog = state.betModal.dogs.find(d=>d.box===box);
  render();
};
window.selType = t => { state.selType=t; render(); };
window.selStake = s => { state.selStake=s; render(); };
window.addBet = addBet;
window.fetchResults = fetchResults;
window.updateWeight = (k,v) => {
  state.weights[k]=+v;
  store.set('weights', state.weights);
  if(state.raceData) {
    state.raceData.races = state.raceData.races.map(race=>{
      const scored=calcProbs(race.dogs,state.weights);
      return {...race,dogs:scored,topPick:[...scored].sort((a,b)=>b.aiScore-a.aiScore)[0]};
    });
  }
  render();
};
window.resetWeights = () => {
  state.weights={form:40,winRate:25,boxDraw:15,speed:20};
  store.set('weights',state.weights);
  render();
};

// ── Init ──
render();
fetchRaces(AU_TRACKS[state.trackIdx]);
startAutoRefresh();
</script>
